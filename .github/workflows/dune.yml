name: Dune

# Release tags: dune-v<upstream-version>-zcaml.<revision>, the version
# `dune --version` prints (`3.24.2+zcaml.5`), with `-` for `+`, which URLs mangle.
#   dune-v3.24.2-zcaml.5 -> dune 3.24.2 with zcaml's changes, revision 5
# The dune built is the one pinned in build.zig.zon, with the revision in
# build/dune/tool.zig; the tag has to name its version (checked against the
# build). Never move an existing tag.
#
# Dune is one binary per host, for any OCaml version. All of them are bootstrapped
# on Linux, with the x86_64-linux-gnu-hosted toolchains of a published OCaml
# release (the latest by default) and, for macOS, the pinned macOS SDK
# (build.zig.zon's `xcode_frameworks`). Then they are smoke-tested: the Linux ones
# in distro containers (other architectures through qemu), the Windows one under
# Wine, the macOS ones on macOS, natively and under Rosetta.

on:
  push:
    tags:
      - "dune-v*"
  workflow_dispatch:
    inputs:
      ocaml_tag:
        description: "OCaml release (ocaml-v*) to bootstrap with; default: the latest"
        required: false
        type: string

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"

jobs:
  resolve:
    name: Resolve OCaml release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ocaml_tag: ${{ steps.find.outputs.ocaml_tag }}
      ocaml_version: ${{ steps.find.outputs.ocaml_version }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.ocaml_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("ocaml-v"))] | sort_by(.publishedAt) | last | .tagName')}"
          if [[ ! "$tag" =~ ^ocaml-v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$ ]]; then
            echo "error: '$tag' is not an OCaml release (ocaml-vX.Y.Z[-N])" >&2
            exit 1
          fi
          echo "ocaml_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ocaml_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Bootstrapping with $tag"

  build:
    name: Bootstrap dune
    needs: resolve
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      OCAML_TAG: ${{ needs.resolve.outputs.ocaml_tag }}
      OCAML_VERSION: ${{ needs.resolve.outputs.ocaml_version }}
      NATIVE: x86_64-linux-gnu
      HOSTS: >-
        x86_64-linux-gnu aarch64-linux-gnu x86_64-linux-musl aarch64-linux-musl
        x86_64-windows-gnu aarch64-macos-none x86_64-macos-none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Download the toolchains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/toolchains/$OCAML_VERSION"
          for h in $HOSTS; do
            archive="ocaml-$OCAML_VERSION-host-$NATIVE-target-$h.tar.zst"
            gh release download "$OCAML_TAG" --pattern "$archive" --dir "$RUNNER_TEMP"
            mkdir -p "$root/host-$NATIVE/target-$h"
            zstd -d -q -c "$RUNNER_TEMP/$archive" | tar -xf - -C "$root/host-$NATIVE/target-$h"
            rm "$RUNNER_TEMP/$archive"
          done
          echo "TOOLCHAINS=$root" >> "$GITHUB_ENV"

      - name: Bootstrap dune
        run: |
          set -euo pipefail
          targets=()
          for h in $HOSTS; do targets+=("-Ddune-target=$h"); done
          zig build --summary failures -Docaml dune -Ddune-toolchains="$TOOLCHAINS" "${targets[@]}"

      - name: Set up QEMU & Wine
        run: |
          set -euo pipefail
          docker run --rm --privileged tonistiigi/binfmt --install arm64 >/dev/null
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends wine

      - name: Run dune
        run: |
          set -euo pipefail
          version="$(zig-out/dune/$NATIVE/bin/dune --version)"
          # Runs the test in <image> for <platform>, with the checkout at /w.
          in_docker() {
            docker run --rm --platform "$1" -v "$PWD:/w" -w /w "$2" \
              sh -c "${3:+$3 && }scripts/test-dune.sh zig-out/dune/$4/bin/dune $version"
          }
          for h in $HOSTS; do
            case "$h" in
              x86_64-linux-gnu) scripts/test-dune.sh "zig-out/dune/$h/bin/dune" "$version" ;;
              aarch64-linux-gnu) in_docker linux/arm64 ubuntu:24.04 "" "$h" ;;
              x86_64-linux-musl) in_docker linux/amd64 alpine:3.22 "apk add --no-cache bash >/dev/null" "$h" ;;
              aarch64-linux-musl) in_docker linux/arm64 alpine:3.22 "apk add --no-cache bash >/dev/null" "$h" ;;
              x86_64-windows-gnu) WINEDEBUG=-all scripts/test-dune.sh "zig-out/dune/$h/bin/dune.exe" "$version" wine ;;
              *-macos-none) ;; # test-macos
              *) echo "error: no way to run dune for $h" >&2; exit 1 ;;
            esac
          done

      - name: Package
        run: |
          set -euo pipefail
          version="$(zig-out/dune/$NATIVE/bin/dune --version)"
          version="${version/+/-}"
          mkdir archives
          for h in $HOSTS; do
            tar --sort=name -I 'zstd -19' -cf "archives/dune-$version-$h.tar.zst" -C "zig-out/dune/$h" .
          done
          ls -l archives

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: dune
          path: archives/*.tar.zst
          compression-level: 0

  test-macos:
    name: Run dune on macOS
    needs: build
    runs-on: depot-macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Rosetta 2 is available
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: dune
          path: archives

      - name: Run dune (native + Rosetta 2)
        run: |
          set -euo pipefail
          for h in aarch64-macos-none x86_64-macos-none; do
            archive="$(ls archives/dune-*-$h.tar.zst)"
            version="$(basename "$archive" "-$h.tar.zst")"
            version="${version#dune-}"
            version="${version/-zcaml/+zcaml}"
            mkdir -p "dune-$h"
            zstd -d -q -c "$archive" | tar -xf - -C "dune-$h"
            # macOS's bash 3.2: no empty arrays under `set -u`.
            if [[ $h == x86_64-* ]]; then
              scripts/test-dune.sh "dune-$h/bin/dune" "$version" arch -x86_64
            else
              scripts/test-dune.sh "dune-$h/bin/dune" "$version"
            fi
          done

  publish:
    name: Publish dune
    needs: [resolve, build, test-macos]
    if: startsWith(github.ref, 'refs/tags/dune-v')
    runs-on: depot-ubuntu-24.04-2
    timeout-minutes: 10
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: dune
          path: archives

      - name: Create GitHub Release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          OCAML_TAG: ${{ needs.resolve.outputs.ocaml_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^dune-v(([0-9]+\.[0-9]+\.[0-9]+)-zcaml\.([0-9]+))$ ]]; then
            echo "error: tag '$TAG_NAME' does not match dune-vX.Y.Z-zcaml.N" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          upstream="${BASH_REMATCH[2]}"
          revision="${BASH_REMATCH[3]}"
          files=(archives/*.tar.zst)
          for f in "${files[@]}"; do
            if [[ "$(basename "$f")" != "dune-$version-"* ]]; then
              echo "error: $f is not dune $version: build.zig.zon or build/dune/tool.zig pin another dune than '$TAG_NAME' names" >&2
              exit 1
            fi
          done
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "dune $upstream+zcaml.$revision" \
              --notes "dune $upstream with zcaml's changes (cross-compiling dune pkg's packages with -x), for every zcaml host, bootstrapped with the $OCAML_TAG toolchains. One binary per host: it works with any OCaml version."
          fi
