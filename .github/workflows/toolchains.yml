name: Toolchains

on:
  push:
    tags:
      - "ocaml-*"
  workflow_dispatch:
    inputs:
      ocaml_version:
        description: "OCaml version to build and verify"
        required: false
        default: "5.5.1"
        type: choice
        options:
          - "5.5.1"

permissions:
  contents: write
  actions: write

env:
  ZIG_VERSION: "0.17.0"
  OCAML_VERSION: ${{ inputs.ocaml_version || '5.5.1' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the entire matrix on an 8-core Depot Ubuntu runner (4x
  #    rate vs 16x on 32-core), verify all 27 Linux-hosted pairs, and upload
  #    each (host, target) .tar.zst archive in parallel with compressionLevel=0.
  # ---------------------------------------------------------------------------
  build-and-test-linux:
    name: Build Matrix & Verify Linux + Wine
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Restore Zig global cache, packages & QEMU sysroots
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/zcaml
            zig-pkg
          key: zcaml-linux-global-v2-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zcaml-linux-global-v2-${{ env.ZIG_VERSION }}-

      - name: Install QEMU user-mode emulators & Wine
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            qemu-user \
            wine \
            zstd \
            binutils \
            curl \
            ca-certificates

      - name: Build full OCaml host -> target matrix
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
        run: zig build --summary failures -Docaml -Docaml-version=${{ env.OCAML_VERSION }} matrix

      - name: Verify all Linux-hosted toolchains (native + QEMU + Wine)
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
        run: |
          zig build --verbose --summary all -Docaml verify \
            -Docaml-version=${{ env.OCAML_VERSION }} \
            -Dverify-jobs=8 \
            -Dsave-deferred=${{ runner.temp }}/deferred-from-linux

      - name: Package all (host, target) toolchain archives in parallel
        run: |
          set -euo pipefail
          VER="${{ env.OCAML_VERSION }}"
          OUT_DIR="${{ runner.temp }}/archives"
          mkdir -p "$OUT_DIR"

          pack_one() {
            local target_dir="$1"
            local out_dir="$2"
            local ver="$3"
            local host_dir
            host_dir="$(dirname "$target_dir")"
            local host_name
            host_name="$(basename "$host_dir")"
            local target_name
            target_name="$(basename "$target_dir")"
            local host_triple="${host_name#host-}"
            local target_triple="${target_name#target-}"
            local pair_id="ocaml-${ver}-host-${host_triple}-target-${target_triple}"
            if [[ "$host_triple" != *-windows-* ]]; then
              for tool in ocamlc ocamlopt ocamldep ocamlobjinfo ocamllex ocamldoc; do
                if [[ -f "${target_dir}/bin/${tool}.opt" ]]; then
                  ln -sf "${tool}.opt" "${target_dir}/bin/${tool}"
                fi
              done
            fi
            tar --sort=name -I 'zstd -3 --long=27' -cf "${out_dir}/${pair_id}.tar.zst" -C "$target_dir" .
          }
          export -f pack_one

          find "zig-out/${VER}" -mindepth 2 -maxdepth 2 -type d -name 'target-*' -print0 \
            | xargs -0 -P 8 -I {} bash -c 'pack_one "$1" "$2" "$3"' _ {} "$OUT_DIR" "$VER"

      - name: Upload Linux -> macOS deferred test bundles
        uses: actions/upload-artifact@v4
        with:
          name: _internal-deferred-from-linux
          path: ${{ runner.temp }}/deferred-from-linux
          retention-days: 1
          compression-level: 1

      - name: Upload all toolchain artifacts in parallel (compressionLevel=0)
        uses: actions/github-script@v7
        env:
          ARCHIVES_DIR: ${{ runner.temp }}/archives
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFile } = require('child_process');

            const uploadEntry = path.resolve(path.dirname(process.argv[1]), '../../../upload-artifact/v4/dist/upload/index.js');
            const dir = process.env.ARCHIVES_DIR;
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.tar.zst')).sort();

            console.log(`Uploading ${files.length} toolchain archives with concurrency=8 and compressionLevel=0...`);
            const concurrency = 8;
            let idx = 0;

            function uploadOne(file) {
              const fullPath = path.join(dir, file);
              const artifactName = file.replace(/\.tar\.zst$/, '');
              return new Promise((resolve, reject) => {
                execFile(
                  process.execPath,
                  [uploadEntry],
                  {
                    env: {
                      ...process.env,
                      'INPUT_NAME': artifactName,
                      'INPUT_PATH': fullPath,
                      'INPUT_RETENTION-DAYS': '7',
                      'INPUT_COMPRESSION-LEVEL': '0',
                      'INPUT_IF-NO-FILES-FOUND': 'error',
                      'INPUT_OVERWRITE': 'true',
                      'INPUT_INCLUDE-HIDDEN-FILES': 'false',
                    },
                    maxBuffer: 10 * 1024 * 1024,
                  },
                  (err, stdout, stderr) => {
                    if (err) {
                      console.error(`Failed uploading ${artifactName}:\n${stdout}\n${stderr}`);
                      return reject(err);
                    }
                    console.log(`Uploaded ${artifactName}`);
                    resolve();
                  }
                );
              });
            }

            async function worker() {
              while (idx < files.length) {
                const file = files[idx++];
                await uploadOne(file);
              }
            }
            await Promise.all(Array.from({ length: concurrency }, () => worker()));
            console.log(`Uploaded all ${files.length} toolchain artifacts!`);

  # ---------------------------------------------------------------------------
  # 2. Verify all macOS-hosted toolchains (aarch64-macos natively + x86_64-macos
  #    via Rosetta 2) AND execute the macOS binaries cross-compiled on Linux.
  # ---------------------------------------------------------------------------
  test-macos:
    name: Verify macOS Toolchains
    needs: build-and-test-linux
    runs-on: depot-macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Restore macOS Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            .zig-cache
          key: zcaml-macos-verify-v2-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build/tools.zig', 'build/tools/verify_toolchains.zig') }}
          restore-keys: |
            zcaml-macos-verify-v2-${{ env.ZIG_VERSION }}-

      - name: Ensure Rosetta 2 is available for x86_64-macos testing
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Download macOS toolchain archives
        uses: actions/download-artifact@v4
        with:
          pattern: ocaml-${{ env.OCAML_VERSION }}-host-*-macos-none-target-*
          path: ${{ runner.temp }}/macos-archives
          merge-multiple: true

      - name: Download Linux -> macOS deferred test bundles
        uses: actions/download-artifact@v4
        with:
          name: _internal-deferred-from-linux
          path: ${{ runner.temp }}/deferred-from-linux

      - name: Extract & verify all macOS toolchains
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
        run: |
          set -euo pipefail
          VER="${{ env.OCAML_VERSION }}"
          ROOT="${{ runner.temp }}/macos-root/zig-out/${VER}"
          ARCHIVES="${{ runner.temp }}/macos-archives"
          mkdir -p "$ROOT"

          extract_one() {
            local archive="$1"
            local root="$2"
            local ver="$3"
            local base
            base="$(basename "$archive" .tar.zst)"
            local rest="${base#ocaml-${ver}-host-}"
            local host_triple="${rest%%-target-*}"
            local target_triple="${rest#*-target-}"
            local dest="${root}/host-${host_triple}/target-${target_triple}"
            mkdir -p "$dest"
            zstd -d -c "$archive" | tar \
              --exclude='*compiler-libs*' \
              --exclude='*.cmt' \
              --exclude='*.cmti' \
              --exclude='*.mli' \
              --exclude='./bin/ocaml' \
              --exclude='./bin/ocamlnat' \
              --exclude='./bin/ocamlc' \
              --exclude='./bin/ocamlopt' \
              --exclude='./bin/ocamldep' \
              --exclude='./bin/ocamlobjinfo' \
              --exclude='./bin/ocamllex' \
              -xf - -C "$dest"
          }
          export -f extract_one

          find "$ARCHIVES" -name '*.tar.zst' -print0 \
            | xargs -0 -P 8 -I {} bash -c 'extract_one "$1" "$2" "$3"' _ {} "$ROOT" "$VER"

          find "${{ runner.temp }}/deferred-from-linux" -type f -exec chmod +x {} +

          zig build --verbose --summary all -Docaml verify \
            -Docaml-version=${{ env.OCAML_VERSION }} \
            -Drun-deferred=${{ runner.temp }}/deferred-from-linux \
            -Dverify-root="$ROOT" \
            -Dverify-jobs=8 \
            -Dsave-deferred=${{ runner.temp }}/deferred-from-macos

      - name: Upload macOS -> Linux/Windows cross-compiled test bundles
        uses: actions/upload-artifact@v4
        with:
          name: _internal-deferred-from-macos
          path: ${{ runner.temp }}/deferred-from-macos
          retention-days: 1
          compression-level: 1

  # ---------------------------------------------------------------------------
  # 3. Verify all Windows-hosted toolchains on a Depot Windows runner.
  # ---------------------------------------------------------------------------
  test-windows:
    name: Verify Windows Toolchains
    needs: build-and-test-linux
    runs-on: depot-windows-2025-4
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Restore Windows Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            .zig-cache
          key: zcaml-windows-verify-v2-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build/tools.zig', 'build/tools/verify_toolchains.zig') }}
          restore-keys: |
            zcaml-windows-verify-v2-${{ env.ZIG_VERSION }}-

      - name: Download Windows toolchain archives
        uses: actions/download-artifact@v4
        with:
          pattern: ocaml-${{ env.OCAML_VERSION }}-host-x86_64-windows-gnu-target-*
          path: _windows-archives
          merge-multiple: true

      - name: Extract & verify all Windows-hosted toolchains
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
        run: |
          set -euo pipefail
          powershell.exe -NoProfile -NonInteractive -Command 'Add-MpPreference -ExclusionPath $PWD.Path, $env:RUNNER_TEMP, $env:TEMP -ErrorAction SilentlyContinue' || true
          VER="${{ env.OCAML_VERSION }}"
          ROOT="_windows-root/zig-out/${VER}"
          ARCHIVES="_windows-archives"
          mkdir -p "$ROOT"

          for archive in "$ARCHIVES"/*.tar.zst; do
            base="$(basename "$archive" .tar.zst)"
            rest="${base#ocaml-${VER}-host-}"
            host_triple="${rest%%-target-*}"
            target_triple="${rest#*-target-}"
            dest="${ROOT}/host-${host_triple}/target-${target_triple}"
            mkdir -p "$dest"
            zstd -d -c "$archive" | tar --force-local \
              --exclude='*compiler-libs*' \
              --exclude='*.cmt' \
              --exclude='*.cmti' \
              --exclude='*.mli' \
              --exclude='./bin/ocaml.exe' \
              --exclude='./bin/ocamlnat.exe' \
              --exclude='./bin/ocamlc.exe' \
              --exclude='./bin/ocamlopt.exe' \
              --exclude='./bin/ocamldep.exe' \
              --exclude='./bin/ocamlobjinfo.exe' \
              --exclude='./bin/ocamllex.exe' \
              -xf - -C "$dest" &
          done
          wait

          rm -rf zig-pkg
          zig build --verbose --summary all -Docaml verify \
            -Docaml-version=${{ env.OCAML_VERSION }} \
            -Dverify-root="$ROOT" \
            -Dverify-jobs=4 \
            -Dsave-deferred="_deferred-from-windows"

      - name: Upload Windows -> Linux cross-compiled test bundles
        uses: actions/upload-artifact@v4
        with:
          name: _internal-deferred-from-windows
          path: _deferred-from-windows
          retention-days: 1
          compression-level: 1

  # ---------------------------------------------------------------------------
  # 4. Execute the Linux/Windows binaries cross-compiled by the macOS and
  #    Windows hosts on a lightweight 2-core (1x rate) runner, and clean up
  #    internal handoff artifacts.
  # ---------------------------------------------------------------------------
  publish-toolchains:
    name: Publish Verified Toolchains
    needs:
      - build-and-test-linux
      - test-macos
      - test-windows
    runs-on: depot-ubuntu-24.04-2
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Restore Linux verify Zig cache & QEMU sysroots
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/zcaml
            .zig-cache
          key: zcaml-linux-verify-v2-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build/tools.zig', 'build/tools/verify_toolchains.zig') }}
          restore-keys: |
            zcaml-linux-verify-v2-${{ env.ZIG_VERSION }}-

      - name: Install QEMU & Wine for deferred cross-target execution
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            qemu-user \
            wine \
            binutils \
            curl \
            ca-certificates

      - name: Download deferred bundles from macOS & Windows hosts
        uses: actions/download-artifact@v4
        with:
          pattern: _internal-deferred-from-*
          path: ${{ runner.temp }}/deferred-bundles
          merge-multiple: true

      - name: Execute Linux & Windows target binaries compiled on macOS & Windows
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
        run: |
          find "${{ runner.temp }}/deferred-bundles" -type f -exec chmod +x {} +
          zig build --verbose --summary all -Docaml verify \
            -Docaml-version=${{ env.OCAML_VERSION }} \
            -Drun-deferred=${{ runner.temp }}/deferred-bundles

      - name: Download all verified toolchain archives for release
        if: startsWith(github.ref, 'refs/tags/ocaml-')
        uses: actions/download-artifact@v4
        with:
          pattern: ocaml-${{ env.OCAML_VERSION }}-host-*-target-*
          path: ${{ runner.temp }}/release-archives
          merge-multiple: true

      - name: Create GitHub Release and attach toolchain archives
        if: startsWith(github.ref, 'refs/tags/ocaml-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ARCHIVES_DIR: ${{ runner.temp }}/release-archives
        run: |
          set -euo pipefail
          RELEASE_NAME="${TAG_NAME#ocaml-}"
          shopt -s nullglob
          files=("$ARCHIVES_DIR"/*.tar.zst)
          if (( ${#files[@]} == 0 )); then
            echo "error: no .tar.zst archives found in $ARCHIVES_DIR" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi

      - name: Clean up internal handoff artifacts
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const failed = process.env.JOB_STATUS !== 'success';
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts) {
              if (failed || artifact.name.startsWith('_internal-')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
