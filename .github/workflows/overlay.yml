name: Overlay

# overlay/ is zcaml/zcaml-overlay's main branch, as dune needs an opam
# repository's packages/ at the root: its history, split out, pushed there. Only
# ever a fast-forward: its commits are the same at each split.

on:
  push:
    branches: [main]
    paths: ["overlay/**"]
  workflow_dispatch:

concurrency:
  group: overlay-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to zcaml-overlay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push overlay/
        env:
          # A deploy key of zcaml-overlay's, with write access.
          DEPLOY_KEY: ${{ secrets.OVERLAY_DEPLOY_KEY }}
        run: |
          split="$(git subtree split --prefix=overlay)"
          key="$RUNNER_TEMP/overlay-key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git push git@github.com:zcaml/zcaml-overlay.git "$split:refs/heads/main"
